services:
  # ============================================================
  # Backend API (FastAPI) - watertracker
  # Le frontend est déployé sur Vercel (frontend/vercel.json), la base sur Neon.
  # ============================================================
  - type: web
    name: watertracker-api
    runtime: python
    plan: free
    rootDir: backend
    region: oregon
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Base PostgreSQL/PostGIS hébergée chez Neon : coller l'URL de connexion fournie par Neon.
      - key: DATABASE_URL
        sync: false
      # Adresse du frontend Vercel (sans barre finale), plusieurs adresses séparées par des virgules.
      - key: CORS_ORIGINS
        sync: false
      # Facultatif : expression régulière couvrant les adresses de déploiement Vercel.
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTE_API_KEY
        sync: false
      - key: GEE_PROJECT
        sync: false
      - key: SCHEDULER_ENABLED
        value: "false"
