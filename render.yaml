services:
  # ============================================================
  # Backend API (FastAPI) - watertracker
  # ============================================================
  - type: web
    name: watertracker-api
    runtime: python
    plan: free
    rootDir: backend
    region: oregon
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Base PostgreSQL/PostGIS hébergée chez Neon : coller l'URL de connexion fournie par Neon.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTE_API_KEY
        sync: false
      - key: GEE_PROJECT
        sync: false
      - key: SCHEDULER_ENABLED
        value: "false"

  # ============================================================
  # Frontend statique (Vite build -> dist)
  # ============================================================
  - type: web
    name: watertracker-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Application à page unique : /carte et /bulletin sont servis par index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
